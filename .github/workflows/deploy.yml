name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimal nötige Rechte
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende Produktions-Deployments nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: GitHub Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v6

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen (öffentlicher Modus – nur freigegebene Bilder)
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DEMO_MODE: 'false'

      - name: Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
